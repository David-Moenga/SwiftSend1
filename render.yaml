services:
  - type: web
    name: swiftsend1
    env: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn swiftsend_api.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: swiftsend1-3.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://swiftsend.vendas.co.ke
      - key: CSRF_TRUSTED_ORIGINS
        value: https://swiftsend.vendas.co.ke
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    releaseCommand: python manage.py migrate
